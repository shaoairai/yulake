<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1000px" height="600px" viewBox="-0.5 -0.5 1000 600" content="&lt;mxfile host=&quot;app.diagrams.net&quot;&gt;&lt;diagram name=&quot;預約狀態機&quot; id=&quot;booking-state&quot;&gt;&lt;mxGraphModel dx=&quot;1000&quot; dy=&quot;600&quot; grid=&quot;1&quot; gridSize=&quot;10&quot; guides=&quot;1&quot; tooltips=&quot;1&quot; connect=&quot;1&quot; arrows=&quot;1&quot; fold=&quot;1&quot; page=&quot;1&quot; pageScale=&quot;1&quot; pageWidth=&quot;1000&quot; pageHeight=&quot;600&quot; math=&quot;0&quot; shadow=&quot;0&quot;&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#388e3c"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c62828"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#757575"/>
    </marker>
  </defs>
  <g>
    <!-- Title -->
    <text x="500" y="40" fill="#333333" font-family="Helvetica" font-size="24" font-weight="bold" text-anchor="middle">預約狀態流轉圖 (State Machine)</text>
    <text x="500" y="65" fill="#666666" font-family="Helvetica" font-size="12" text-anchor="middle">Booking Status State Diagram</text>

    <!-- Start -->
    <circle cx="100" cy="280" r="20" fill="#333" stroke="#333" stroke-width="2"/>
    <text x="100" y="320" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">開始</text>

    <!-- Pending State -->
    <rect x="180" y="230" width="140" height="100" fill="#fff3e0" stroke="#e65100" stroke-width="3" rx="15"/>
    <text x="250" y="265" fill="#e65100" font-family="Helvetica" font-size="11" text-anchor="middle">pending</text>
    <text x="250" y="290" fill="#333" font-family="Helvetica" font-size="16" font-weight="bold" text-anchor="middle">待確認</text>
    <text x="250" y="315" fill="#666" font-family="Helvetica" font-size="9" text-anchor="middle">等待店家確認預約</text>

    <!-- Confirmed State -->
    <rect x="400" y="230" width="140" height="100" fill="#c8e6c9" stroke="#388e3c" stroke-width="3" rx="15"/>
    <text x="470" y="265" fill="#388e3c" font-family="Helvetica" font-size="11" text-anchor="middle">confirmed</text>
    <text x="470" y="290" fill="#333" font-family="Helvetica" font-size="16" font-weight="bold" text-anchor="middle">已確認</text>
    <text x="470" y="315" fill="#666" font-family="Helvetica" font-size="9" text-anchor="middle">店家已確認預約</text>

    <!-- Completed State -->
    <rect x="620" y="120" width="140" height="100" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="15"/>
    <text x="690" y="155" fill="#1565c0" font-family="Helvetica" font-size="11" text-anchor="middle">completed</text>
    <text x="690" y="180" fill="#333" font-family="Helvetica" font-size="16" font-weight="bold" text-anchor="middle">已完成</text>
    <text x="690" y="205" fill="#666" font-family="Helvetica" font-size="9" text-anchor="middle">服務已順利完成</text>

    <!-- No Show State -->
    <rect x="620" y="340" width="140" height="100" fill="#ffcdd2" stroke="#c62828" stroke-width="3" rx="15"/>
    <text x="690" y="375" fill="#c62828" font-family="Helvetica" font-size="11" text-anchor="middle">no_show</text>
    <text x="690" y="400" fill="#333" font-family="Helvetica" font-size="16" font-weight="bold" text-anchor="middle">未出席</text>
    <text x="690" y="425" fill="#666" font-family="Helvetica" font-size="9" text-anchor="middle">顧客未依約前往</text>

    <!-- Cancelled by Customer State -->
    <rect x="820" y="170" width="150" height="80" fill="#f5f5f5" stroke="#757575" stroke-width="2" rx="12"/>
    <text x="895" y="200" fill="#757575" font-family="Helvetica" font-size="10" text-anchor="middle">cancelled_by_customer</text>
    <text x="895" y="225" fill="#333" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle">顧客取消</text>
    <text x="895" y="242" fill="#666" font-family="Helvetica" font-size="8" text-anchor="middle">顧客主動取消預約</text>

    <!-- Cancelled by Salon State -->
    <rect x="820" y="310" width="150" height="80" fill="#f5f5f5" stroke="#757575" stroke-width="2" rx="12"/>
    <text x="895" y="340" fill="#757575" font-family="Helvetica" font-size="10" text-anchor="middle">cancelled_by_salon</text>
    <text x="895" y="365" fill="#333" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle">店家取消</text>
    <text x="895" y="382" fill="#666" font-family="Helvetica" font-size="8" text-anchor="middle">店家取消此預約</text>

    <!-- End States -->
    <circle cx="690" cy="520" r="15" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="690" cy="520" r="10" fill="#333"/>
    <text x="690" y="550" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">結束</text>

    <circle cx="895" cy="470" r="15" fill="none" stroke="#757575" stroke-width="2"/>
    <circle cx="895" cy="470" r="10" fill="#757575"/>
    <text x="895" y="500" fill="#666" font-family="Helvetica" font-size="10" text-anchor="middle">結束（取消）</text>

    <!-- Arrows -->
    <!-- Start to Pending -->
    <path d="M120 280 L180 280" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="150" y="270" fill="#333" font-family="Helvetica" font-size="9" text-anchor="middle">顧客送出</text>

    <!-- Pending to Confirmed -->
    <path d="M320 280 L400 280" fill="none" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow-green)"/>
    <rect x="340" y="260" width="60" height="20" fill="#c8e6c9" stroke="#388e3c" rx="3"/>
    <text x="370" y="274" fill="#388e3c" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle">確認</text>

    <!-- Confirmed to Completed -->
    <path d="M540 250 L600 200 L620 180" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <rect x="545" y="195" width="50" height="18" fill="#e3f2fd" stroke="#1565c0" rx="3"/>
    <text x="570" y="208" fill="#1565c0" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle">完成</text>

    <!-- Confirmed to No Show -->
    <path d="M540 310 L600 360 L620 380" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#arrow-red)"/>
    <rect x="535" y="345" width="65" height="18" fill="#ffcdd2" stroke="#c62828" rx="3"/>
    <text x="567" y="358" fill="#c62828" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle">No-Show</text>

    <!-- Pending to Cancelled by Customer -->
    <path d="M250 230 L250 140 L820 140 L820 170" fill="none" stroke="#757575" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>
    <text x="535" y="130" fill="#757575" font-family="Helvetica" font-size="9" text-anchor="middle">顧客取消</text>

    <!-- Pending to Cancelled by Salon -->
    <path d="M250 330 L250 420 L780 420 L780 350 L820 350" fill="none" stroke="#757575" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>
    <text x="515" y="435" fill="#757575" font-family="Helvetica" font-size="9" text-anchor="middle">店家取消</text>

    <!-- Confirmed to Cancelled by Customer -->
    <path d="M540 260 L580 230 L780 170 L820 190" fill="none" stroke="#757575" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>

    <!-- Confirmed to Cancelled by Salon -->
    <path d="M540 300 L580 330 L780 370 L820 350" fill="none" stroke="#757575" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>

    <!-- Completed to End -->
    <path d="M690 220 L690 505" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- No Show to End -->
    <path d="M690 440 L690 505" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Cancelled to End -->
    <path d="M895 250 L895 455" fill="none" stroke="#757575" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
    <path d="M895 390 L895 455" fill="none" stroke="#757575" stroke-width="1.5"/>

    <!-- No Show Warning -->
    <rect x="770" y="400" width="150" height="50" fill="#fff8e1" stroke="#ffa000" stroke-width="1" rx="5"/>
    <text x="845" y="420" fill="#e65100" font-family="Helvetica" font-size="10" font-weight="bold" text-anchor="middle">⚠️ 注意</text>
    <text x="845" y="438" fill="#666" font-family="Helvetica" font-size="9" text-anchor="middle">No-Show 會累計爽約次數</text>

    <!-- Legend -->
    <rect x="40" y="460" width="280" height="120" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" rx="8"/>
    <text x="180" y="485" fill="#333" font-family="Helvetica" font-size="12" font-weight="bold" text-anchor="middle">圖例說明</text>

    <line x1="60" y1="505" x2="100" y2="505" stroke="#388e3c" stroke-width="2"/>
    <text x="110" y="510" fill="#333" font-family="Helvetica" font-size="10">店家操作（確認）</text>

    <line x1="200" y1="505" x2="240" y2="505" stroke="#1565c0" stroke-width="2"/>
    <text x="250" y="510" fill="#333" font-family="Helvetica" font-size="10">完成服務</text>

    <line x1="60" y1="530" x2="100" y2="530" stroke="#c62828" stroke-width="2"/>
    <text x="110" y="535" fill="#333" font-family="Helvetica" font-size="10">未出席標記</text>

    <line x1="200" y1="530" x2="240" y2="530" stroke="#757575" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="250" y="535" fill="#333" font-family="Helvetica" font-size="10">取消操作</text>

    <circle cx="70" cy="560" r="8" fill="#333"/>
    <text x="85" y="565" fill="#333" font-family="Helvetica" font-size="10">開始/結束狀態</text>

    <!-- Status Code Reference -->
    <rect x="340" y="460" width="300" height="120" fill="#fafafa" stroke="#e0e0e0" stroke-width="1" rx="8"/>
    <text x="490" y="485" fill="#333" font-family="Helvetica" font-size="12" font-weight="bold" text-anchor="middle">狀態碼對照</text>

    <text x="360" y="510" fill="#e65100" font-family="Courier" font-size="10">pending</text>
    <text x="470" y="510" fill="#666" font-family="Helvetica" font-size="10">→ 待確認</text>

    <text x="360" y="528" fill="#388e3c" font-family="Courier" font-size="10">confirmed</text>
    <text x="470" y="528" fill="#666" font-family="Helvetica" font-size="10">→ 已確認</text>

    <text x="360" y="546" fill="#1565c0" font-family="Courier" font-size="10">completed</text>
    <text x="470" y="546" fill="#666" font-family="Helvetica" font-size="10">→ 已完成</text>

    <text x="360" y="564" fill="#c62828" font-family="Courier" font-size="10">no_show</text>
    <text x="470" y="564" fill="#666" font-family="Helvetica" font-size="10">→ 未出席</text>

    <!-- Version -->
    <text x="960" y="580" fill="#999" font-family="Helvetica" font-size="10" text-anchor="end">v1.0 | 約來客 Yulake</text>
  </g>
</svg>
